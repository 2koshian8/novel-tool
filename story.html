<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>話数一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>小説管理ツール</h1>
<p>研究主任の初プログラム 🥵💕</p>

<div class="card">
  <a href="index.html">🏠 ホームへ戻る</a>

<h2>📚 ダッシュボード</h2>
 
<div class="next-work-row">

  <a id="nextDraftCard" class="next-work-card" href="#">
    <div class="next-work-title">🔥 次の肉付け</div>
    <div class="next-work-episode">未設定</div>
  </a>

  <a id="nextCleanCard" class="next-work-card" href="#">
    <div class="next-work-title">✍️ 次の清書</div>
    <div class="next-work-episode">未設定</div>
  </a>

  <a id="nextFinalCard" class="next-work-card" href="#">
    <div class="next-work-title">✅ 次の最終確認</div>
    <div class="next-work-episode">未設定</div>
  </a>

  <a id="nextCoverCard" class="next-work-card" href="#">
  <div class="next-work-title">🎨 次の表紙</div>
  <div class="next-work-episode">未設定</div>
</a>

</div>

  <div class="card">
  <h3>📚 シリーズ総文字数</h3>
  <p id="totalCount">0文字</p>
</div>

<div class="schedule-row">

  <div class="schedule-box">
    <div class="schedule-title">
      📅 次回投稿
    </div>

   <div class="schedule-episode" id="nextPostEpisode">
  XXV
</div>

   
  </div>

  <div class="schedule-box">
    <div class="schedule-title">
      📝 次回予約作業
    </div>

   <div class="schedule-episode" id="nextReserveEpisode">
  XXVI
</div>


  </div>

</div>

<div class="stats-row">

  <div class="stat-box">
    <div class="stat-title">投稿済み</div>
    <div class="stat-count" id="postedCount">0話</div>
  </div>

  <div class="stat-box">
    <div class="stat-title">清書中</div>
    <div class="stat-count" id="writingCount">0話</div>
  </div>

  <div class="stat-box">
    <div class="stat-title">未着手</div>
    <div class="stat-count" id="notyetCount">0話</div>
  </div>

</div>


</div>
<div class="card">

  <h2 class="center-title">
    📖 話数一覧
  </h2>

<button onclick="createNewEpisode()">＋ 新規作成</button>

<div class="filter-row">
  <button onclick="filterEpisodes('all')">全部</button>
  <button onclick="filterEpisodes('done')">投稿済み</button>
  <button onclick="filterEpisodes('writing')">清書中</button>
  <button onclick="filterEpisodes('notyet')">未着手</button>
</div>
 <div id="episodeList"></div>

</div>
</div>
<script src="episodes.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAVWPJDnP0X2nPmbg9BxeV3WRZV1DGowZQ",
  authDomain: "novel-tool-c135d.firebaseapp.com",
  databaseURL: "https://novel-tool-c135d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "novel-tool-c135d",
  storageBucket: "novel-tool-c135d.firebasestorage.app",
  messagingSenderId: "14513468450",
  appId: "1:14513468450:web:c5bb27cf1e7a9faf02467b"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
</script>

<script>
const episodeList = document.getElementById("episodeList");

let total = 0;
let posted = 0;
let writing = 0;
let notyet = 0;

let firebaseEpisodesData = {};

/* true・"true"の両方をチェック済みとして扱う */
function isChecked(value) {
  return value === true || value === "true";
}

/* Firebaseに値がなければ、以前のlocalStorageを予備として読む */
function getEpisodeValue(episode, fieldName, localKey, defaultValue = "") {
  const firebaseEpisode =
    firebaseEpisodesData[String(episode.id)] ||
    firebaseEpisodesData[episode.id] ||
    {};

  const firebaseValue = firebaseEpisode[fieldName];

  if (firebaseValue !== null && firebaseValue !== undefined) {
    return firebaseValue;
  }

  const localValue = localStorage.getItem(localKey);

  if (localValue !== null) {
    return localValue;
  }

  return defaultValue;
}

    function renderEpisodes() {
  episodeList.innerHTML = "";

  let total = 0;
  let posted = 0;
  let writing = 0;
  let notyet = 0;

  episodes.forEach(episode => {
    const finalText = String(
      getEpisodeValue(
        episode,
        "FinalText",
        "episode" + episode.id + "FinalText",
        ""
      )
    );

    const pixiv = isChecked(
      getEpisodeValue(
        episode,
        "PixivCheck",
        "episode" + episode.id + "-pixiv",
        false
      )
    );

    const reserve = isChecked(
      getEpisodeValue(
        episode,
        "ReserveCheck",
        "episode" + episode.id + "-reserve",
        false
      )
    );

    const textDone = isChecked(
      getEpisodeValue(
        episode,
        "TextCheck",
        "episode" + episode.id + "-text",
        false
      )
    );

    const postDate = getEpisodeValue(
      episode,
      "PostDate",
      "episode" + episode.id + "PostDate",
      ""
    );

    let statusText = "未着手";
    let statusClass = "not-started";
    let statusData = "notyet";

    if (pixiv) {
      statusText = "投稿済み";
      statusClass = "posted";
      statusData = "done";
      posted++;
    } else if (reserve) {
      statusText = "予約済み";
      statusClass = "reserved";
      statusData = "writing";
      writing++;
    } else if (textDone) {
      statusText = "清書済み";
      statusClass = "clean";
      statusData = "writing";
      writing++;
    } else {
      notyet++;
    }

    total += finalText.length;

    const card = document.createElement("a");

    card.href = "episode.html?id=" + episode.id;
    card.className = "story-card";
    card.dataset.status = statusData;

    card.innerHTML = `
      <img
        src="covers/cover${episode.id}.png"
        class="cover-thumb"
        alt="表紙"
        onerror="this.src='covers/no-cover.png'"
      >

      <div class="story-card-header">
        <h3>${episode.title}</h3>

        <span class="status-badge ${statusClass}">
          ${statusText}
        </span>

        <span class="post-date">
          投稿日：${postDate || "未設定"}
        </span>
      </div>

      <p>${finalText.length}文字</p>
    `;

    episodeList.appendChild(card);
  });

  document.getElementById("totalCount").textContent =
    total.toLocaleString() + "文字";

  document.getElementById("postedCount").textContent =
    posted + "話";

  document.getElementById("writingCount").textContent =
    writing + "話";

  document.getElementById("notyetCount").textContent =
    notyet + "話";
}

function filterEpisodes(status) {
  const cards = document.querySelectorAll(".story-card");

  cards.forEach(card => {
    if (
      status === "all" ||
      card.dataset.status === status
    ) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

function setNextWork(cardId, episode) {
  const card = document.getElementById(cardId);
  const title =
    card.querySelector(".next-work-episode");

  if (episode) {
    title.textContent = episode.title;
    card.href = "episode.html?id=" + episode.id;
  } else {
    title.textContent = "なし";
    card.href = "#";
  }
}

function updateDashboard() {
  let nextDraft = null;
  let nextClean = null;
  let nextFinal = null;
  let nextCover = null;

  episodes.forEach(episode => {
    const draftText = String(
      getEpisodeValue(
        episode,
        "DraftText",
        "episode" + episode.id + "DraftText",
        ""
      )
    );

    const cleanText = String(
      getEpisodeValue(
        episode,
        "CleanText",
        "episode" + episode.id + "CleanText",
        ""
      )
    );

    const finalText = String(
      getEpisodeValue(
        episode,
        "FinalText",
        "episode" + episode.id + "FinalText",
        ""
      )
    );

    const pixiv = isChecked(
      getEpisodeValue(
        episode,
        "PixivCheck",
        "episode" + episode.id + "-pixiv",
        false
      )
    );

    const coverDone = isChecked(
      getEpisodeValue(
        episode,
        "CoverCheck",
        "episode" + episode.id + "-cover",
        false
      )
    );

    if (!nextDraft && draftText.length === 0) {
      nextDraft = episode;
    }

    if (
      !nextClean &&
      draftText.length > 0 &&
      cleanText.length === 0
    ) {
      nextClean = episode;
    }

    if (
      !nextFinal &&
      cleanText.length > 0 &&
      finalText.length === 0 &&
      !pixiv
    ) {
      nextFinal = episode;
    }

    if (!nextCover && !coverDone) {
      nextCover = episode;
    }
  });

  setNextWork("nextDraftCard", nextDraft);
  setNextWork("nextCleanCard", nextClean);
  setNextWork("nextFinalCard", nextFinal);
  setNextWork("nextCoverCard", nextCover);

  const unpostedEpisodes = episodes.filter(episode => {
    return !isChecked(
      getEpisodeValue(
        episode,
        "PixivCheck",
        "episode" + episode.id + "-pixiv",
        false
      )
    );
  });

  const nextPost = unpostedEpisodes[0] || null;
  const nextReserve = unpostedEpisodes[1] || null;

 if (nextPost) {
  document.getElementById("nextPostEpisode").textContent =
    nextPost.title;
} else {
  document.getElementById("nextPostEpisode").textContent =
    "なし";
}

if (nextReserve) {
  document.getElementById("nextReserveEpisode").textContent =
    nextReserve.title;
} else {
  document.getElementById("nextReserveEpisode").textContent =
    "なし";
}

}

async function createNewEpisode() {
  try {
    const ids = [
      ...episodes.map(episode => Number(episode.id)),
      ...Object.keys(firebaseEpisodesData).map(
        id => Number(id)
      )
    ].filter(
      id => id < 100 && !Number.isNaN(id)
    );

    const nextId =
      ids.length > 0
        ? Math.max(...ids) + 1
        : 1;

    console.log("新規作成ID:", nextId);

    location.href =
      "episode.html?id=" + nextId;
  } catch (error) {
    console.error(
      "新規作成IDの取得に失敗しました:",
      error
    );

    alert(
      "新しい話数を作成できませんでした。"
    );
  }
}

async function loadStoryData() {
  try {
    const snapshot = await database
      .ref("episodes")
      .once("value");

    firebaseEpisodesData =
      snapshot.val() || {};

    Object.keys(firebaseEpisodesData).forEach(id => {
      const data =
        firebaseEpisodesData[id] || {};

      const exists = episodes.some(
        episode => episode.id == id
      );

      if (!exists) {
        episodes.push({
          id: Number(id),
          title:
            data.Title ||
            id + "話"
        });
      } else if (data.Title) {
        const episode = episodes.find(
          episode => episode.id == id
        );

        episode.title = data.Title;
      }
    });

    episodes.sort(
      (a, b) => Number(a.id) - Number(b.id)
    );

    renderEpisodes();
    updateDashboard();

    console.log(
      "Firebaseから話数一覧を読み込みました"
    );
  } catch (error) {
    console.error(
      "Firebaseの読み込みに失敗しました:",
      error
    );

    episodeList.innerHTML =
      "<p>話数データを読み込めませんでした。</p>";
  }
}

loadStoryData();
</script>
</body>
</html>
